workflows:
  android-workflow:
    name: Errand Buddy Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      vars:
        PACKAGE_NAME: "com.crowthertech.errandbuddy"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web app
        script: |
          npm run build
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build Android APK (debug)
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - techcrowther@gmail.com
        notify:
          success: true
          failure: true